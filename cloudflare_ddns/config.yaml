name: Cloudflare DDNS
version: "1.2.0"
slug: cloudflare_ddns
description: Keeps Cloudflare DNS records pointed at your home's public IP
url: https://github.com/benbrookshire/cloudflare-dns-updater
arch:
  - aarch64
  - amd64
init: false
# Needed to find the router over UPnP (multicast) and to see this machine's
# own IPv6 addresses. The app only makes outbound requests and opens no ports.
host_network: true
options:
  api_token: ""
  zone: ""
  records:
    - "@"
  interval_minutes: 15
  ipv6: false
  router_upnp: true
schema:
  api_token: password
  zone: str
  records:
    - str
  interval_minutes: int(1,1440)
  ipv6: bool
  router_upnp: bool
  router_upnp_url: url?

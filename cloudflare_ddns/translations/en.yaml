configuration:
  api_token:
    name: Cloudflare API token
    description: Token with Zone → Zone → Read and Zone → DNS → Edit for your zone.
  zone:
    name: Zone
    description: The domain as it appears in Cloudflare, e.g. example.com. Required.
  records:
    name: Records
    description: Names to keep updated. "@" is the domain itself; use a short name like "home" or a full name like home.example.com.
  interval_minutes:
    name: Check interval (minutes)
    description: How often to check the public IP and update Cloudflare.
  ipv6:
    name: Update IPv6 (AAAA) too
    description: Only turn on if your home network has public IPv6.
  router_upnp:
    name: Ask the router (UPnP)
    description: Require your router to confirm its public IPv4 address over UPnP before DNS is changed. Needs UPnP turned on in the router, and the router must hold the public IP itself (no second router in front of it).
  router_upnp_url:
    name: Router UPnP description URL
    description: Optional. Leave empty to find the router automatically. Example for an eero, http://192.168.1.1:1900/igd.xml
